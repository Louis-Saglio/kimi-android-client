# Tuned 2026-08-01: an 8 GB swapfile was added to the VPS (previously 0 swap),
# so the earlier very tight caps (1536m/1g, set after the 2026-07-31 OOM that
# took down kimi-web.service) could be relaxed. Daemon heap 3g + Kotlin daemon
# 2g + 2 workers fits in RAM; swap absorbs spikes.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
